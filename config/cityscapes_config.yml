BASE_MODEL: "COCO-InstanceSegmentation/mask_rcnn_R_101_FPN_3x.yaml"

MODELTYPE: "instance_segmentation"
JOBNAME: ""

MODEL:
  WEIGHTS: "/projects/PUCHALLA/LLP2024/tumor-segmentation/models/BACKBONES/model_final_a3ec72.pkl"
  ROI_HEADS:
    NUM_CLASSES: 8           # Cityscapes things: person, rider, car, truck, bus, train, motorcycle, bicycle
    BATCH_SIZE_PER_IMAGE: 512
    POSITIVE_FRACTION: 0.5
    SCORE_THRESH_TEST: 0.05  # detectron2 default; 0.3 (tumor config) suppresses low-confidence dets and hurts AP
    NMS_THRESH_TEST: 0.5     # detectron2 default; 0.3 is too aggressive for crowded street scenes

INPUT:
  # Cityscapes frames are 2048x1024; detectron2's Cityscapes reference recipe
  MIN_SIZE_TRAIN: [800, 832, 864, 896, 928, 960, 992, 1024]
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048

DATASETS:
  TRAIN: ["my_dataset_train"]
  TEST: ["my_dataset_test", "my_dataset_val"]
  AUGMENTATION: false

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: false

SOLVER:
  # 2975 train images / IMS_PER_BATCH 2 -> ~1488 iters per epoch
  MAX_ITER: 20000
  IMS_PER_BATCH: 2
  BASE_LR: 0.0025            # linear-scaled from the 0.01 @ batch-8 reference recipe
  STEPS: [14000, 18000]
  GAMMA: 0.1
  WARMUP_ITERS: 1000
  WARMUP_FACTOR: 0.001

OUTPUT_DIR: "model_output/cityscapes/"

SENSAUG:
  ENABLED: false
  WARMUP_ITERS: 600        # clean-training iterations before the first SA pass
  SA_PERIOD: 600           # iterations between sensitivity-analysis passes
  NUM_LEVELS: 5             # L sensitive intensity levels per augmentation
  ALPHA_GRID_SIZE: 11       # diagnostic magnitudes swept in [0, 1]
  LAMBDA: 0.05              # regularizer in g(alpha)
  NONE_PROB: 0.2            # prob. of skipping augmentation after warmup
  VAL_DATASET: "my_dataset_val"
  MAX_SA_IMAGES: 9999        # cap on validation images per SA pass (compute control)
  KID_SUBSET_SIZE: 50       # torchmetrics KID subset size (clamped to image count)

POST_EVAL:                   # post-training robustness eval on UNSEEN corruptions (test split)
  ENABLED: false
  GRID_SIZE: 6               # uniform magnitudes in [0,1] for the foreground-IoU degradation curves
  SEVERITIES: [1.0]          # magnitudes at which to run the (heavier) AP + IoU evaluators
  MAX_IMAGES: 200            # cap on test images for the lightweight curve sweep
  CORRUPTIONS: []            # subset of held-out corruptions; empty = all

ADDTIONAL_HOOKS:            # array with .py file paths to extra HookBase classes
  - ""
